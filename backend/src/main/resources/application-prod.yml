server:
  port: ${PORT:8080}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false
      
  mail:
    host: ${SMTP_HOST:smtp.sendgrid.net}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_at_least_256_bits_long_for_security_compliance_12345}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  mail:
    from: ${MAIL_FROM:support@interviewcopilot.com}

logging:
  level:
    root: INFO
    com.interviewcopilot: INFO
