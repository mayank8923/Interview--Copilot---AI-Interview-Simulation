version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: interview-copilot-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: interview_copilot_dev
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local

